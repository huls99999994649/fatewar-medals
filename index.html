<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>メダル交換イベント終了</title>
<style>
:root{--bg:#120c1f;--bg2:#1f1433;--ink:#f6eefc;--sub:#b9a9d1;--org:#ff9a3c;--org2:#ffc46b;--pur:#9b6bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,#2b1a4d 0%,var(--bg) 55%,#0a0614 100%);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden;position:relative}
.moon{position:absolute;top:6vh;right:8vw;width:min(22vw,150px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff3d6,#ffd48a 60%,#f0a850);box-shadow:0 0 80px 20px rgba(255,170,70,.28);opacity:.9}
.stars{position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 28% 62%,#fff,transparent),
  radial-gradient(1px 1px at 44% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 63% 14%,#fff,transparent),
  radial-gradient(1px 1px at 78% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 80%,#fff,transparent),
  radial-gradient(1px 1px at 8% 84%,#fff,transparent),radial-gradient(1px 1px at 52% 88%,#fff,transparent);opacity:.55}
.hills{position:absolute;left:0;right:0;bottom:0;height:22vh;background:
  radial-gradient(60% 100% at 20% 100%,#0a0614 60%,transparent 61%),radial-gradient(70% 100% at 80% 100%,#0d0819 60%,transparent 61%)}
main{position:relative;z-index:1;text-align:center;max-width:640px;width:100%}
.medal{width:132px;height:132px;margin:0 auto 26px;border-radius:50%;position:relative;
  background:conic-gradient(from 210deg,#ffd98a,#ff9a3c,#c76a14,#ffd98a 60%,#ffb35a,#ffd98a);
  box-shadow:0 10px 40px rgba(255,154,60,.35),inset 0 0 0 6px rgba(255,255,255,.18);display:grid;place-items:center}
.medal::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed rgba(60,25,0,.45)}
.medal span{font-size:56px;filter:drop-shadow(0 2px 0 rgba(60,25,0,.4))}
.tag{display:inline-block;letter-spacing:.3em;font-size:12px;color:var(--org2);border:1px solid rgba(255,196,107,.4);
  padding:6px 14px;border-radius:999px;margin-bottom:18px;background:rgba(255,154,60,.08)}
h1{margin:0;word-break:keep-all;font-size:clamp(28px,6.4vw,52px);line-height:1.25;font-weight:800;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff,#ffd9a0 60%,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 small{display:block;font-size:.5em;margin-top:.5em;font-weight:700;letter-spacing:.08em;
  background:none;color:var(--ink);-webkit-text-fill-color:var(--ink)}
h1 .l{display:block}
.rule{width:96px;height:3px;margin:28px auto;border-radius:3px;background:linear-gradient(90deg,transparent,var(--org),transparent)}
p{margin:0;word-break:keep-all;overflow-wrap:anywhere;color:var(--sub);font-size:clamp(14px,3.6vw,17px);line-height:2}
.foot{margin-top:34px;font-size:12px;color:#8573a6;letter-spacing:.12em}
</style>
</head>
<body>
<div class="stars"></div><div class="moon"></div><div class="hills"></div>
<main>
  <div class="medal"><span>🎃</span></div>
  <div class="tag">EVENT FINISHED</div>
  <h1><span class="l">メダル交換イベント</span><span class="l">終了！</span><small>お疲れ様でした！</small></h1>
  <div class="rule"></div>
  <p>ご参加いただいた<wbr>みなさん、<wbr>ありがとうございました。</p>
</main>
</body>
</html>
