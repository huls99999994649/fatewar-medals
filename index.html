<style>
/* Layout: 1カラムのツール。上に見出しと保存状態、タブ3つ(マッチ/メダル登録/交換履歴)。羊皮紙色の地に紫インクとカボチャ色。 */
:root{
  --bg:#f2ead8; --surface:#fbf6ea; --ink:#2b2140; --muted:#6d6283; --line:#d9ccb0;
  --accent:#b9540f; --accent-ink:#ffffff; --good:#2f6b2c; --warn:#a33a2a;
  --r-pre:#356aa3; --r-cla:#6b3fa6; --r-leg:#8f6a00;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16101f; --surface:#211832; --ink:#f0e8ff; --muted:#a99cc2; --line:#3b2e55;
  --accent:#f0913f; --accent-ink:#1b1024; --good:#86cc80; --warn:#ff9d8a;
  --r-pre:#7db4ee; --r-cla:#b48cf0; --r-leg:#e8bf4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16101f; --surface:#211832; --ink:#f0e8ff; --muted:#a99cc2; --line:#3b2e55;
  --accent:#f0913f; --accent-ink:#1b1024; --good:#86cc80; --warn:#ff9d8a;
  --r-pre:#7db4ee; --r-cla:#b48cf0; --r-leg:#e8bf4a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:400;font-size:1.65rem;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0 0 8px}
.sub{color:var(--muted);font-size:.85rem;margin:4px 0 0}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.status{font-size:.8rem;color:var(--muted);white-space:nowrap}
.status.err{color:var(--warn)}
.tabs{display:flex;gap:4px;margin:18px 0 16px;border-bottom:2px solid var(--line)}
.tabs button{flex:1;padding:10px 6px;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 14px;font-size:.88rem}
.notice.warn{border-color:var(--warn)}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 14px;font-size:.9rem}
.summary b{font-variant-numeric:tabular-nums;font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 12px}
.card header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.card h3{margin:0;font-size:1.05rem}
.swap{font-weight:700;color:var(--accent)}
.swap.none{color:var(--muted);font-weight:400}
.row{margin:6px 0}
.row .lab{display:block;font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;gap:5px;align-items:center;border:1.5px solid currentColor;border-radius:4px;padding:1px 7px;font-size:.82rem;background:transparent}
.chip span{color:var(--ink)}
.rar{display:flex;gap:10px;align-items:baseline;margin:10px 0 4px;padding-top:8px;border-top:1px solid var(--line);font-size:.85rem}.rar b{font-size:.9rem}.rar span{color:var(--muted)}.rar.pre b{color:var(--r-pre)}.rar.cla b{color:var(--r-cla)}.rar.leg b{color:var(--r-leg)}
.chip.pre{color:var(--r-pre)} .chip.cla{color:var(--r-cla)} .chip.leg{color:var(--r-leg)}
.chip em{font-style:normal;font-size:.7rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 4px}
.chip small{color:var(--muted);font-size:.72rem}
.theme{margin:0 0 14px}
.theme>h3{display:flex;justify-content:space-between;align-items:baseline;margin:0;padding:6px 0;border-bottom:1px solid var(--line);font-size:1rem}
.theme>h3 span{font-size:.82rem;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.theme>h3 .done{color:var(--good);font-weight:700}
.m{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.m .dot{width:9px;height:9px;border-radius:50%;flex:none;background:currentColor}
.m.pre .dot{color:var(--r-pre)} .m.cla .dot{color:var(--r-cla)} .m.leg .dot{color:var(--r-leg)}
.m .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.m.zero .nm{color:var(--muted)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;font-size:1.15rem;cursor:pointer}
.step button:disabled{opacity:.35;cursor:default}
.step .q{min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.spare{font-size:.72rem;color:var(--accent);min-width:3.6em;text-align:right}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form input{flex:1;min-width:10ch;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.empty{color:var(--muted);padding:18px 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:currentColor}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top">

  </div>

    <button role="tab" data-tab="guild" aria-selected="false">交換履歴</button>

  <main id="view"></main>
</div>

<style>
body{margin:0;font-size:15px}
img{max-width:100%}
[hidden]{display:none!important}
.gift{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;font:inherit;font-size:.72rem;padding:0 6px;margin-left:2px;cursor:pointer}

.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.keybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;overflow-wrap:anywhere;user-select:all;margin:6px 0}
.err{color:var(--warn);font-size:.88rem;margin:8px 0 0}

.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer;padding:0}

.log li{padding:4px 0;border-bottom:1px dashed var(--line)}
.m{padding-inline:8px;border-radius:4px}

.stat{margin:0 0 8px;font-size:.85rem}
.ack{color:var(--muted);margin-left:4px}
.ack.ok{color:var(--good)}
.ack.wait{color:var(--accent)}
.stat.ok{color:var(--good)}
.stat.gap{color:var(--warn);background:var(--bg);border:1px solid var(--warn);border-radius:4px;padding:6px 8px;font-size:.9rem}
.card.diff{border-left:5px solid var(--warn)}
.recv{border-color:var(--accent)}
.recv ul{margin:6px 0 10px;padding-left:1.2em}
</style>

<script>
const API="https://zwkzckxtcsgxbrelpfmz.supabase.co/rest/v1/rpc/";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3a3pja3h0Y3NneGJyZWxwZm16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTgwNjAsImV4cCI6MjEwNDQ3NDA2MH0.XXeXHOGKllS6zkUW65-b2khPW2WL6UgM5OO5qUxF5pQ";
const THEMES=[
 ["甘いお菓子",["悪魔ロリポップ","ドクロキャンディケイン","クモの巣ドーナツ","幽霊猫グミ","おばけマシュマロ","コウモリパフェ","かぼちゃプリン","魔女の帽子クッキー","ハロウィンナイトケーキ"]],
 ["表情パンプキン",["びっくりパンプキン","ごきげんパンプキン","怒りパンプキン","キュートパンプキン","しょんぼりパンプキン","感嘆パンプキン","あたふたパンプキン","ずる賢いパンプキン","神秘のパンプキン"]],
 ["変幻の亡霊",["ゴーストナイト","ゴーストスローアー","ゴーストバーサーカー","幽霊狼騎兵","幽霊サイ騎兵","幽霊猛竜騎兵","幽霊ワイバーン騎兵","幽霊村人","幽霊の預言者"]],
 ["猫のファミリー",["のぞかせて","会いたいにゃ","元気かにゃ？","写真撮ろうにゃ","すねすね涙ちゃん","放っておいて","見習い魔法猫","舞踏会の王子猫","夜の守護猫"]],
 ["マジックシアター",["トランプ","水晶玉","魔法の杖","魔法の手袋","ピエロの仮面","マジシャンの帽子","マリオネット","両面コイン","神秘のマジックボックス"]],
 ["犬の仲間たち",["お菓子いる？","うるうるまなざし","ガブっとひとくち","遊ぼうワン！","そばにいるワン","魔法の変装","犬の騎士","狂熱の記録犬","魔法犬錬金術師"]],
 ["理想のタペストリー",["活気ある住居","伐採キャンプ","農耕地","研究拠点","鉱石採掘","牧場荘園","交易所","出発地点","ユートピア"]],
 ["ハロウィンアドベンチャー",["首なし騎士","アイシングの魔女","スケルトン執事","血月のウェアウルフ","幽霊の首領","悪夢の軍馬","邪悪なトレント","ダークエルフ","大魔術師"]],
 ["英雄碑",["シルヴァン","モーガン・ル・フェイ","孫悟空","フレイヤ","ファルハド","ペトラ","ジャンヌ","アーサー","英雄大全"]]
];
const RAR_LABEL={pre:"プレシャス",cla:"クラシック",leg:"レジェンド"};
function rarityOf(t,p){if(t<5)return p===8?"cla":"pre";if(t<8)return p===8?"leg":(p>=6?"cla":"pre");return p>=6?"leg":(p>=3?"cla":"pre")}
const MEDALS=[];
THEMES.forEach(([tn,names],t)=>names.forEach((n,p)=>MEDALS.push({id:t*9+p+1,t,p,name:n,theme:tn,r:rarityOf(t,p)})));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qty=(q,id)=>(q&&q[id])|0;
const ERR={"invalid gift":"確認できる記録がありません。","invalid guild code":"ギルドコードが違います。","name taken":"その名前は使われています。別の名前にするか、パスワードでログインしてください。","invalid member":"名前またはパスワードが違います。","invalid password":"パスワードは4文字以上で入力してください。","not enough spare":"余り(2枚以上)がないため記録できません。","invalid name":"名前は1〜20文字で入力してください。","guild full":"登録人数が上限に達しました。ハルタソに連絡してください。","registration closed":"現在、新規登録を受け付けていません。ハルタソに連絡してください。"};

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let code=store.get("fw_code"), ident=store.get("fw_ident"); // {id,secret,name}
let members=[], hold=new Map(), gifts=[], me=null, adjM={}; // adjM: 相手ID→{pre,cla,leg} 話し合いで解決済みの枚数(自分から見た値)
let tab="match", filter="all", pending=null, gateErr="", gateMode="login", loaded=false, netErr=false;
let hasPw; // undefined=未確認
let lastSig="";
let dirty=false, saving=false, timer=null, changed=new Set();

async function rpc(fn,args){
  let r;
  try{r=await fetch(API+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify(args)})}
  catch(e){throw new Error("network")}
  const body=await r.json().catch(()=>null);
  if(!r.ok){const m=(body&&body.message)||"error";const e=new Error(ERR[m]||m);e.raw=m;throw e}
  return body;
}
function setStatus(t,err){const s=$("#status");s.textContent=t;s.className="status"+(err?" err":"")}

async function load(){
  if(!code)return;
  try{
    const s=await rpc("fw_state",ident?{p_code:code,p_member:ident.id,p_secret:ident.secret}:{p_code:code});
    const sig=JSON.stringify([s.members,s.holdings,s.gifts,s.adj]);
    const skip=!!(ident&&me)&&loaded&&!netErr&&sig===lastSig;lastSig=sig;
    members=s.members;gifts=s.gifts;
    adjM={};(s.adj||[]).forEach(([o,r,q])=>{const k={precious:"pre",classic:"cla",legend:"leg"}[r];if(!k)return;(adjM[o]=adjM[o]||{pre:0,cla:0,leg:0})[k]+=q});
    const h=new Map();members.forEach(m=>h.set(m.id,{}));
    s.holdings.forEach(([mid,med,q])=>{if(h.has(mid))h.get(mid)[med]=q});
    hold=h;netErr=false;
    if(ident){
      const self=members.find(m=>m.id===ident.id);
      if(self&&self.name!==ident.name){ident.name=self.name;store.set("fw_ident",ident)}
      if(!self){store.del("fw_ident");ident=null;me=null}
      else if(!dirty&&!saving)me={name:ident.name,q:{...(h.get(ident.id)||{})}};
    }
    if(ident&&hasPw===undefined){try{hasPw=await rpc("fw_has_pw",{p_code:code,p_member:ident.id,p_secret:ident.secret})}catch(e){}}
    loaded=true;
    if(skip&&ident&&me)return;
  }catch(e){
    if(e.raw==="invalid guild code"){store.del("fw_code");code=null;gateErr=e.message}
    else netErr=true;
  }
  render();
}

async function flush(){
  if(saving){timer=setTimeout(flush,300);return}
  if(!ident||!changed.size)return;
  saving=true;dirty=false;
  const ids=[...changed];changed=new Set();
  try{
    await rpc("fw_set_qty",{p_code:code,p_member:ident.id,p_secret:ident.secret,p_items:ids.map(id=>({medal_id:+id,qty:qty(me.q,id)}))});
    setStatus(dirty?"保存中…":"保存済み");
  }catch(e){ids.forEach(i=>changed.add(i));setStatus("保存できません。通信を確認してください",true)}
  saving=false;
  if(dirty)flush();
}
function queueSave(){dirty=true;setStatus("保存中…");clearTimeout(timer);timer=setTimeout(flush,700)}

/* ---------- マッチ計算 ---------- */
const missingIn=(q,t)=>MEDALS.filter(m=>m.t===t&&qty(q,m.id)===0).length;
function matchWith(oq){
  const g0=MEDALS.filter(m=>qty(me.q,m.id)>=2&&qty(oq,m.id)===0);
  const t0=MEDALS.filter(m=>qty(oq,m.id)>=2&&qty(me.q,m.id)===0);
  const rs=["pre","cla","leg"].filter(r=>g0.some(m=>m.r===r)&&t0.some(m=>m.r===r));
  const give=g0.filter(m=>rs.includes(m.r)), get=t0.filter(m=>rs.includes(m.r));
  const swaps=rs.reduce((a,r)=>a+Math.min(give.filter(m=>m.r===r).length,get.filter(m=>m.r===r).length),0);
  return {give,get,swaps,give0:g0,get0:t0};
}
function chip(m,extra,qq,to,done){
  return `<span class="chip ${m.r}" title="${esc(m.theme)}／${RAR_LABEL[m.r]}"><span>${esc(m.name)}</span>${qq?`<small>余${qq-1}</small>`:""}${extra?`<em>${extra}</em>`:""}${done?`<small>${done}</small>`:""}${to?`<button class="gift" data-gift="${m.id}" data-to="${to}">贈った</button>`:""}</span>`;
}
const nameOf=id=>(members.find(m=>m.id===id)||{}).name||"不明";
const maxGift=()=>gifts.reduce((a,g)=>Math.max(a,g.id),0);
const unread=()=>{if(!ident)return[];const s=store.get("fw_seen_"+ident.id)|0;return gifts.filter(g=>g.to===ident.id&&g.id>s).sort((a,b)=>a.id-b.id)};
function ackMark(g){
  const mine=g.to===ident.id;
  return mine?(g.ok?`<small class="ack ok">確認済み</small>`:`<button class="gift" data-confirm="${g.id}">受け取りを確認</button>`)
             :(g.ok?`<small class="ack ok">相手が確認済み</small>`:`<small class="ack wait">相手の確認待ち</small>`);
}
function recvBanner(un){
  un=un.filter(g=>!g.ok);
  if(!un.length)return "";
  const show=un.slice(-5).reverse();
  const li=show.map(g=>{const m=MEDALS.find(x=>x.id===g.medal);return `<li>${esc(nameOf(g.from))}さんから${esc(m?m.name:"メダル")}を${g.qty}枚受け取りました ${ackMark(g)}</li>`}).join("");
  const more=un.length>show.length?`<p class="sub">ほか${un.length-show.length}件</p>`:"";
  return `<div class="notice recv"><b>前回から</b><ul>${li}</ul>${more}<p class="sub">ゲームで受け取りを確認できたら、各行の「受け取りを確認」を押してください。</p><button class="btn" data-seen="1">閉じる</button></div>`;
}

function pairStat(oid){
  const st={sent:0,recv:0,sp:0,rp:0,sm:new Set(),rm:new Set(),adj:0};
  gifts.forEach(g=>{
    if(g.from===ident.id&&g.to===oid){st.sent+=g.qty;st.sm.add(g.medal);if(!g.ok)st.sp+=g.qty}
    else if(g.to===ident.id&&g.from===oid){st.recv+=g.qty;st.rm.add(g.medal);if(!g.ok)st.rp+=g.qty}
  });
  const a=adjM[oid];if(a)st.adj=a.pre+a.cla+a.leg;
  return st;
}
/* 差 = 贈った − 受け取った − 話し合いで解決済みの分 */
const gap=st=>st.sent-st.recv-st.adj;
/* レア度ごとの「あなたが贈った枚数 − 受け取った枚数」(正=お返し待ち、負=あなたがお返しする分、解決済みの分は除く) */
function rarNet(oid){
  const o={pre:0,cla:0,leg:0};
  gifts.forEach(g=>{
    const m=MEDALS.find(x=>x.id===g.medal); if(!m)return;
    if(g.from===ident.id&&g.to===oid)o[m.r]+=g.qty;
    else if(g.to===ident.id&&g.from===oid)o[m.r]-=g.qty;
  });
  const a=adjM[oid];if(a)["pre","cla","leg"].forEach(r=>{o[r]-=a[r]});
  return o;
}
/* 先に多く贈っているレア度(お返し待ち)の枚数。待ちでなければ0 */
function rarGap(oid){
  const n=rarNet(oid);
  return {pre:Math.max(0,n.pre),cla:Math.max(0,n.cla),leg:Math.max(0,n.leg)};
}
/* まだ清算できていないペアか(枚数の差、またはレア度の差がある) */
function unsettled(oid){const n=rarNet(oid);return gap(pairStat(oid))!==0||n.pre!==0||n.cla!==0||n.leg!==0}
function statLine(st,oid){
  const d=gap(st), net=rarNet(oid), nz=["pre","cla","leg"].filter(r=>net[r]!==0);
  let t,c="";
  if(!st.sent&&!st.recv)t="まだやり取りなし";
  else if(d===0&&!nz.length&&!st.sp&&!st.rp){t=`贈り ${st.sent}枚 ／ 受け取り ${st.recv}枚 ✓ 交換済み`;c=" ok"}
  else if(d===0&&!nz.length){t=`贈り ${st.sent}枚 ／ 受け取り ${st.recv}枚`;c=" gap"}
  else if(d===0){t=`贈り ${st.sent}枚 ／ 受け取り ${st.recv}枚`;c=" gap"}
  else if(d>0){t=`⚠ あなたは${st.sent}枚贈り、受け取りは${st.recv}枚 → <strong>あと${d}枚もらっていません</strong>`;c=" gap"}
  else{t=`⚠ 受け取り${st.recv}枚に対して、贈りは${st.sent}枚 → <strong>あと${-d}枚贈っていません</strong>`;c=" gap"}
  if(nz.length>=2)t+=`<br><small class="sub">${nz.map(r=>net[r]>0?`${RAR_LABEL[r]}はあと${net[r]}枚もらっていません`:`${RAR_LABEL[r]}はあと${-net[r]}枚贈っていません`).join("／")}</small>`;
  t+=(st.sp?`<br>相手の確認待ち ${st.sp}枚<small class="sub">（相手がゲームで受け取りを確認すると「確認済み」に変わります）</small>`:"")+(st.rp?`<br><strong>あなたの確認待ち ${st.rp}枚</strong>`:"");
  return `<p class="stat${c}"><b>状況</b>　${t}${st.sent||st.recv?`　<button class="linkbtn" data-hist="${oid}">履歴を見る</button>`:""}</p>`;
}
function viewMatch(){
  const miss=MEDALS.filter(m=>qty(me.q,m.id)===0);
  const spareTotal=MEDALS.reduce((a,m)=>a+Math.max(0,qty(me.q,m.id)-1),0);
  const spareKinds=MEDALS.filter(m=>qty(me.q,m.id)>=2).length;
  const others=members.filter(m=>m.id!==ident.id).map(m=>({m,q:hold.get(m.id)||{}}));
  const list=others.map(x=>{
    const o={...x,...matchWith(x.q)}, rg=rarGap(x.m.id);
    o.sw=["pre","cla","leg"].reduce((a,r)=>a+(rg[r]>0?0:Math.min(o.give.filter(m=>m.r===r).length,o.get.filter(m=>m.r===r).length)),0);
    o.wt=["pre","cla","leg"].some(r=>rg[r]>0&&(o.give.some(m=>m.r===r)||o.get.some(m=>m.r===r)));
    return o;
  }).filter(x=>{if(x.give.length||x.get.length)return true;const st=pairStat(x.m.id);return unsettled(x.m.id)||st.sp>0||st.rp>0})
    .sort((a,b)=>(!!unsettled(b.m.id))-(!!unsettled(a.m.id))||b.sw-a.sw||(b.give.length+b.get.length)-(a.give.length+a.get.length));
  const anySpare=new Set();others.forEach(x=>MEDALS.forEach(m=>{if(qty(x.q,m.id)>=2)anySpare.add(m.id)}));
  const none=miss.filter(m=>!anySpare.has(m.id)).length;
  let h=`<div class="summary"><span>未所持 <b>${miss.length}</b>種</span><span>余り <b>${spareTotal}</b>枚(${spareKinds}種)</span><span>ギルドに余りがない未所持 <b>${none}</b>種</span></div>`;
  h+=`<p class="notice">・まず「メダル登録」で、持っているメダルの枚数を登録してください。登録した内容をもとに、交換できる相手が表示されます。<br>・ゲーム内でメダルを贈った後に、このアプリで「贈った」を押してください。あなたの枚数が減り、相手の枚数が増えます。<br>・ゲーム内で受け取りを確認した後に、このアプリで「受け取りを確認」を押してください。<br>・交換は同じレア度同士(プレシャス⇔プレシャスなど)だけを候補にしています。</p>`;
  if(!list.length)return h+`<p class="empty">いま交換できる相手はいません。他のメンバーがメダルを登録すると、ここに候補が出ます。</p>`;
  list.forEach(x=>{
    const st=pairStat(x.m.id);
    const pm=pending&&pending.to===x.m.id?MEDALS.find(m=>m.id===pending.medal):null;
    let blocks="";
    const rg=rarGap(x.m.id), nt=rarNet(x.m.id), shown=new Set();
    ["pre","cla","leg"].forEach(r=>{
      const gv=x.give.filter(m=>m.r===r), gt=x.get.filter(m=>m.r===r);
      if(!gv.length&&!gt.length)return;
      shown.add(r);
      const wait=rg[r]>0, n=wait?0:Math.min(gv.length,gt.length);
      const give=gv.map(m=>chip(m,missingIn(x.q,m.t)===1?"コンプ":"",qty(me.q,m.id),x.m.id,st.sm.has(m.id)?"贈り済み":"")).join("");
      const get=gt.map(m=>chip(m,missingIn(me.q,m.t)===1?"コンプ":"",qty(x.q,m.id),"",st.rm.has(m.id)?"受取済":"")).join("");
      const conf=!wait&&pm&&pm.r===r?`<div class="confirm"><span>「${esc(pm.name)}」を${esc(x.m.name)}さんに贈りましたか?</span><button class="btn" data-ok="1">記録する</button><button class="btn ghost" data-cancel="1">やめる</button></div>`:"";
      blocks+=`<div class="rar ${r}"><b>${RAR_LABEL[r]}</b><span>${wait?"お返し待ち":`マッチ ${n}組`}</span></div>
      ${wait?`<p class="sub" style="margin:6px 0">${RAR_LABEL[r]}を先に${rg[r]}枚贈っています。お返しを待ちましょう。</p>`:`<div class="row"><span class="lab">あなたが贈れる(${gv.length})</span><div class="chips">${give||'<span class="sub">なし</span>'}</div></div>${conf}`}
      <div class="row"><span class="lab">あなたがもらえる(${gt.length})</span><div class="chips">${get||'<span class="sub">なし</span>'}</div></div>`;
    });
    /* マッチの枠が出ていないレア度で、お返しが残っている/もらえる分があるとき */
    ["pre","cla","leg"].forEach(r=>{
      if(shown.has(r))return;
      const srt=a=>a.filter(m=>m.r===r).sort((p,q)=>p.id-q.id);
      if(nt[r]<0){
        const n=-nt[r], gl=srt(x.give0);
        const cs=gl.map(m=>chip(m,"",qty(me.q,m.id),x.m.id,"")).join("");
        const conf=pm&&pm.r===r?`<div class="confirm"><span>「${esc(pm.name)}」を${esc(x.m.name)}さんに贈りましたか?</span><button class="btn" data-ok="1">記録する</button><button class="btn ghost" data-cancel="1">やめる</button></div>`:"";
        blocks+=gl.length?`<div class="row"><span class="lab">お返しに贈れる(${RAR_LABEL[r]})(${gl.length})</span><div class="chips">${cs}</div></div>${conf}<p class="sub" style="margin:6px 0 0">${esc(x.m.name)}さんが持っていない、あなたの余りです。この中から、あと${n}枚贈ってください${gl.length<n?`(候補は${gl.length}枚です)`:""}。</p>`:`<p class="sub" style="margin:8px 0 0">同じレア度(${RAR_LABEL[r]})でお返しに贈れる余りはありません。</p>`;
      }else if(nt[r]>0&&srt(x.get0).length){
        blocks+=`<div class="row"><span class="lab">あなたがもらえる(${RAR_LABEL[r]})(${srt(x.get0).length})</span><div class="chips">${srt(x.get0).map(m=>chip(m,"",qty(x.q,m.id),"","")).join("")}</div></div>`;
      }
    });
    h+=`<section class="card${unsettled(x.m.id)?" diff":""}"><header><h3>${esc(x.m.name)}</h3><span class="swap ${x.sw?"":"none"}">${x.sw?`マッチ ${x.sw}組`:(x.wt?"お返し待ち":"マッチなし")}</span></header>
      ${statLine(st,x.m.id)}${blocks||'<p class="sub" style="margin:8px 0 0">いま交換できるメダルはありません。</p>'}</section>`;
  });
  return h;
}

function viewMine(){
  const kinds=MEDALS.filter(m=>qty(me.q,m.id)>0).length;
  let h=`<div class="summary"><span>所持 <b>${kinds}</b>/81種</span><span>完成したテーマ <b>${THEMES.filter((_,t)=>missingIn(me.q,t)===0).length}</b>/9</span></div>`;
  h+=`<div class="legend"><span><i style="color:var(--r-pre)"></i>プレシャス</span><span><i style="color:var(--r-cla)"></i>クラシック</span><span><i style="color:var(--r-leg)"></i>レジェンド</span></div>`;
  h+=`<div class="filters">${[["all","すべて"],["spare","余りあり"],["zero","未所持"]].map(([k,l])=>`<button data-filter="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")}</div>`;
  THEMES.forEach(([tn],t)=>{
    const ms=MEDALS.filter(m=>m.t===t);
    const have=ms.filter(m=>qty(me.q,m.id)>0).length;
    const shown=ms.filter(m=>{const q=qty(me.q,m.id);return filter==="all"||(filter==="spare"&&q>=2)||(filter==="zero"&&q===0)});
    if(!shown.length)return;
    h+=`<section class="theme"><h3>${esc(tn)}<span class="${have===9?"done":""}">${have===9?"完成 ":""}${have}/9</span></h3>`;
    shown.forEach(m=>{
      const q=qty(me.q,m.id);
      h+=`<div class="m ${m.r} ${q?"":"zero"} ${q>=2?"rowspare":q?"rowhave":""}"><i class="dot"></i><span class="nm">${esc(m.name)}</span><span class="spare">${q>=2?`余り${q-1}`:""}</span>
        <span class="step"><button data-d="-1" data-id="${m.id}" aria-label="${esc(m.name)}を1減らす" ${q?"":"disabled"}>−</button><span class="q">${q}</span><button data-d="1" data-id="${m.id}" aria-label="${esc(m.name)}を1増やす">＋</button></span></div>`;
    });
    h+=`</section>`;
  });
  return h;
}

function viewGuild(){

  rows.forEach(r=>{

  tb+=`</tbody></table></div>`;
  const mine=gifts.filter(g=>g.from===ident.id||g.to===ident.id).sort((a,b)=>b.id-a.id);
  const groups=new Map();
  mine.forEach(g=>{const o=g.from===ident.id?g.to:g.from;if(!groups.has(o))groups.set(o,{o,list:[],sent:0,recv:0,last:g.at});const x=groups.get(o);x.list.push(g);if(g.from===ident.id)x.sent+=g.qty;else x.recv+=g.qty});
  const fmt=at=>new Date(at).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  const line=g=>{const m=MEDALS.find(x=>x.id===g.medal);const out=g.from===ident.id;return `<li>${fmt(g.at)}　<b>${out?"贈った":"受け取った"}</b>　${esc(m?m.name:"")}${g.qty>1?` ×${g.qty}`:""}　${ackMark(g)}</li>`};
  let h=`<h2>交換履歴(相手ごと・新しい順)</h2>`;
  if(!groups.size)h+=`<p class="sub">まだありません。</p>`;
  groups.forEach(x=>{
    const dd=x.sent-x.recv;
    h+=`<section class="card${dd?" diff":""}" id="h_${x.o}"><header><h3>${esc(nameOf(x.o))}</h3><span class="sub">贈った ${x.sent}枚 ／ 受け取った ${x.recv}枚　最終 ${fmt(x.last)}</span></header>${dd>0?`<p class="stat gap">⚠ <strong>あと${dd}枚もらっていません</strong></p>`:dd<0?`<p class="stat gap">⚠ <strong>あと${-dd}枚贈っていません</strong></p>`:""}<ul class="log">${x.list.slice(0,3).map(line).join("")}</ul>${x.list.length>3?`<details><summary class="sub">すべて見る(${x.list.length}件)</summary><ul class="log">${x.list.slice(3).map(line).join("")}</ul></details>`:""}</section>`;
  });
  h+=`<h2 style="margin-top:18px">ギルドのメンバー</h2>`+tb;
  return h;

  return `<section class="card"><h2>${join?"はじめて使う":"ログイン"}</h2>
    <p class="sub">${join?"ゲーム内の名前と、自分用のパスワードを設定してください。名前はアプリ内のメンバーに表示されます。":"登録した名前とパスワードを入力してください。"}</p>
    <form class="form" id="${join?"joinForm":"loginForm"}"><input id="nameInput" maxlength="20" placeholder="名前" autocomplete="username"><input id="keyInput" type="password" maxlength="64" placeholder="パスワード${join?"(4文字以上)":""}" autocomplete="${join?"new-password":"current-password"}"><button class="btn" type="submit">${join?"登録する":"ログイン"}</button></form>
    ${gateErr?`<p class="err">${esc(gateErr)}</p>`:""}
    <p style="margin:12px 0 0"><button class="linkbtn" data-mode="${join?"login":"join"}">${join?"登録済みの方はログイン":"はじめて使う方はこちら"}</button></p></section>`;
}

function render(){
  const ready=code&&ident&&me;
  $("#tabs").hidden=!ready;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const w=$("#whoBtn");w.hidden=!ready;$("#whoSep").hidden=!ready;if(ready)w.textContent=ident.name+"さん";
  const un=ready?unread():[];
  $("#notice").innerHTML=(netErr?`<p class="notice warn">サーバーに接続できません。通信を確認してください。</p>`:"")+(ready&&hasPw===false&&tab!=="account"?`<div class="notice warn"><b>パスワードを設定してください</b><p class="sub">別の端末でログインするときに使います。</p>${pwForm("パスワード","設定する")}</div>`:"")+(un.length?recvBanner(un):"");
  if(tab==="help"){$("#view").innerHTML=viewHelp();return}
  if(!ready){$("#view").innerHTML=(code&&!loaded&&!netErr&&ident)?`<p class="empty">読み込み中…</p>`:viewGate();return}
  $("#view").innerHTML=tab==="match"?viewMatch():tab==="mine"?viewMine():tab==="account"?viewAccount():viewGuild();
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.tab){tab=d.tab;pending=null;render();return}
  if(d.confirm){
    try{await rpc("fw_confirm",{p_code:code,p_member:ident.id,p_secret:ident.secret,p_gift:+d.confirm});setStatus("受け取りを記録しました")}
    catch(err){setStatus(err.message==="network"?"通信に失敗しました":err.message,true)}
    await load();return;
  }
  if(d.hist){tab="guild";pending=null;render();const el=document.getElementById("h_"+d.hist);if(el)el.scrollIntoView({block:"start"});return}
  if(d.filter){filter=d.filter;render();return}
  if(d.mode){gateMode=d.mode;gateErr="";render();return}
  if(d.logout){store.del("fw_ident");ident=null;me=null;hasPw=undefined;gateErr="";render();return}
  if(d.d&&me){const id=d.id;me.q[id]=Math.max(0,Math.min(999,qty(me.q,id)+Number(d.d)));changed.add(id);queueSave();render();return}
  if(d.seen&&ident){store.set("fw_seen_"+ident.id,maxGift());render();return}
  if(d.gift){pending={to:d.to,medal:+d.gift};render();return}
  if(d.cancel){pending=null;render();return}
  if(d.ok&&pending){
    const p=pending;pending=null;
    if(dirty||saving||changed.size){clearTimeout(timer);await flush()}
    try{await rpc("fw_gift",{p_code:code,p_member:ident.id,p_secret:ident.secret,p_to:p.to,p_medal:p.medal,p_qty:1});setStatus("記録しました")}
    catch(err){setStatus(err.message==="network"?"通信に失敗しました":err.message,true)}
    await load();
  }
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const id=e.target.id;gateErr="";
  try{
    if(id==="codeForm"){
      const c=$("#codeInput").value.trim().toUpperCase();if(!c)return;
      await rpc("fw_state",{p_code:c});code=c;store.set("fw_code",c);await load();return;
    }
    if(id==="nameForm"){
      const nn=$("#renameInput").value.trim();if(!nn)return;
      try{const r2=await rpc("fw_rename",{p_code:code,p_member:ident.id,p_secret:ident.secret,p_name:nn});ident.name=r2.name;store.set("fw_ident",ident);if(me)me.name=r2.name;setStatus("名前を変更しました");await load()}
      catch(err){setStatus(err.message==="network"?"通信に失敗しました":err.message,true)}
      return;
    }
    if(id==="pwForm"){
      const pw=$("#pwInput").value;
      try{await rpc("fw_set_password",{p_code:code,p_member:ident.id,p_secret:ident.secret,p_password:pw});hasPw=true;setStatus("パスワードを設定しました");render()}
      catch(err){setStatus(err.message==="network"?"通信に失敗しました":err.message,true)}
      return;
    }
    const name=$("#nameInput").value.trim();if(!name)return;
    const pw=$("#keyInput").value;
    let r;
    if(id==="joinForm"){r=await rpc("fw_join",{p_code:code,p_name:name,p_password:pw});ident={id:r.member_id,secret:r.secret,name:r.name};hasPw=true;tab="mine";store.set("fw_seen_"+ident.id,maxGift())}
    else{r=await rpc("fw_login",{p_code:code,p_name:name,p_password:pw});ident={id:r.member_id,secret:r.secret,name:r.name};hasPw=r.has_pw;tab="match"}
    store.set("fw_ident",ident);await load();
  }catch(err){gateErr=err.message==="network"?"通信に失敗しました。":err.message;
    if(err.raw==="invalid guild code"){store.del("fw_code");code=null}
    render()}
});

render();
if(code)load();
/* 更新確認: 3秒ごとに軽い「版番号」だけを問い合わせ、変わったときだけ全データを取得する(通信量の節約)。
   版番号が取れないとき・60秒に1回・画面に戻ったときは、そのまま全データを取得する。 */
let lastVer=null, lastFull=0, polling=false;
const idle=()=>ident&&!(document.activeElement&&document.activeElement.tagName==="INPUT")&&document.visibilityState==="visible"&&!dirty&&!saving&&!pending;
async function refresh(force){
  if(!idle()||polling)return;
  polling=true;
  try{
    let v=null;
    try{v=await rpc("fw_ver",{p_code:code,p_member:ident.id})}catch(e){v=null}
    if(!force&&v!==null&&v===lastVer&&Date.now()-lastFull<60000)return;
    await load();
    lastFull=Date.now();
    lastVer=(loaded&&!netErr)?v:null;
  }finally{polling=false}
}
setInterval(()=>refresh(false),3000);
document.addEventListener("visibilitychange",()=>refresh(true));
window.addEventListener("focus",()=>refresh(true));
window.addEventListener("online",()=>refresh(true));
</script>
</body>
</html>
